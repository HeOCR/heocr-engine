# HTRMoPo v1 front matter for this model's Zenodo deposit, in htrmopo 0.5's format.
# The deposit card is this front matter between `---` lines, followed by card_body.md.
# `id` is added at plan step 2 (release/README.md): the version DOI reserved for this
# record's draft. software_hints are the values `ketos publish` would compute from the
# model's kraken_meta. metrics are the pipeline's CER in percent.
summary: Modern Hebrew document line recognition (printed and handwriting-style), trained from scratch on synthetic pages; recognizer of the HeOCR R4d + A1 + R3h pipeline
# Creators (item 7, maintainer, 2026-11-06). HTRMoPo's author items have name, affiliation
# and orcid only; `type` is the InvenioRDM creator type, which the deposit script maps
# (release/README.md). Person names are "Family, Given" (confirmed by Shay's ORCID record).
authors:
  - name: Palachy Affek, Shay
    type: personal
    orcid: https://orcid.org/0000-0002-1459-9320
  - name: HeOCR maintainers
    type: organizational
license: Apache-2.0
software_name: kraken
software_hints:
  - kind=safetensors
  - version>=5.0.0
  - seg_type=baselines
  - one_channel_mode=L
  - legacy_polygons=False
language:
  - heb
script:
  - Hebr
  - Latn
tags:
  - kraken_pytorch
  - hebrew
  - printed
  - handwriting-style
  - synthetic training data
  - HeOCR
model_type:
  - recognition
metrics:  # percent CER, hocrgen primary.v1, pipeline R4d + A1 + R3h (see the card body)
  cer_seed101: 2.0
  cer_heldout: 1.0
  cer_eval_mixed_heldout: 1.7
  cer_eval_typo_heldout: 0.9
  cer_eval_layout_heldout: 12.4
  cer_hocrgen_fixture: 13.0
datasets:
  - https://github.com/HeOCR/hocrsyngen/tree/bb14cd0/src/hocrsyngen/data/synthetic/texts
# Zenodo communities, not part of the HTRMoPo schema; the deposit script reads them.
# heocr: the HeOCR community (https://zenodo.org/communities/heocr, created by Shay).
# ocr_models: the kraken/HTRMoPo model repository, which `kraken list` and `htrmopo list` read.
communities:
  - heocr
  - ocr_models
