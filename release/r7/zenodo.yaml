# Zenodo deposit metadata for R7, read by release/zenodo_deposit.py (`--models r7`).
# R7 is a Tesseract model, as R6 is, so this is NOT HTRMoPo front matter: it is not validated
# against the HTRMoPo v1 schema, has no `software_hints`, and R7 does not go to the `ocr_models`
# community, which `kraken list` and `htrmopo list` read. It uses the same keys as R6's record
# (release/README.md, "R6" and "R7"). The deposit card is this front matter between `---` lines,
# with `id` added, followed by card_body.md. `id` is added at R7 plan step 2: the version DOI
# reserved for this record's draft.
summary: Hebrew printed-text recognition for Tesseract, fine-tuned from tessdata_best heb on real public-domain NLI and Internet Archive scans with Project Ben-Yehuda text (HeOCR R7)
# Creators: as the R4d, A1, R3h and R6 records (release/README.md, "Deposits"). Person names
# are "Family, Given"; `type` is the InvenioRDM creator type.
authors:
  - name: Palachy Affek, Shay
    type: personal
    orcid: https://orcid.org/0000-0002-1459-9320
  - name: HeOCR maintainers
    type: organizational
license: Apache-2.0
software_name: tesseract
language:
  - heb
script:
  - Hebr
tags:
  - tesseract
  - traineddata
  - hebrew
  - printed
  - ocr
  - text-recognition
  - real scans
  - HeOCR
model_type:
  - recognition
metrics:  # percent, hocrgen primary.v1, Tesseract 5.5.3 psm 3, E2d4c (see the card body)
  cer_e2d4c_38: 20.9
  wer_e2d4c_38: 39.3
  cer_e2d4c_10: 39.3
# isDerivedFrom links (InvenioRDM related identifiers): the base model, the training scans
# (the 7 NLI IIIF manifests and the 23 Internet Archive items) and the transcription source.
# No link to R6 (10.5281/zenodo.24109989): the script maps every `related` item to
# isDerivedFrom, and R7 is not derived from R6 (it starts from the same base). Nor
# isNewVersionOf: R7 supersedes nothing, and it is a record of its own, not a Zenodo version
# of R6's. The card body names R6 and its DOI.
related:
