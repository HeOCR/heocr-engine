# Zenodo deposit metadata for R8b, read by release/zenodo_deposit.py (`--models r8b`).
# R8b is a Tesseract model, as R6 and R7 are, so this is NOT HTRMoPo front matter: it is not
# validated against the HTRMoPo v1 schema, has no `software_hints`, and R8b does not go to the
# `ocr_models` community, which `kraken list` and `htrmopo list` read. It uses the same keys as
# R6's and R7's records (release/README.md, "R6", "R7" and "R8b"). The deposit card is this front
# matter between `---` lines, with `id` added, followed by card_body.md. `id` is added at R8b plan
# step 2: the version DOI reserved for this record's draft.
summary: Hebrew printed-text recognition for Tesseract, continued from HeOCR R7 on real NLI and Internet Archive scans, born-digital Reshumot lines and synthetic lines (HeOCR R8b)
# Creators: as the R4d, A1, R3h, R6 and R7 records (release/README.md, "Deposits"). Person names
# are "Family, Given"; `type` is the InvenioRDM creator type.
authors:
  - name: Palachy Affek, Shay
    type: personal
    orcid: https://orcid.org/0000-0002-1459-9320
  - name: HeOCR maintainers
    type: organizational
license: Apache-2.0
software_name: tesseract
language:
  - heb
script:
  - Hebr
tags:
  - tesseract
  - traineddata
  - hebrew
  - printed
  - ocr
  - text-recognition
  - real scans
  - HeOCR
model_type:
  - recognition
metrics:  # CER percent, eval line_fold_v1, every line charged (eval-domains/outputs/r8b_release_figures_v1.json); dev sets, not test scores
  cer_olb_reshumot_dev_all: 2.129
  cer_olb_reshumot_dev_exact: 0.735
  cer_kevar_heldout: 0.757
  cer_yediot_heldout: 1.019
# isDerivedFrom links (InvenioRDM related identifiers): the base model, HeOCR R7 (R8b continues
# from R7's weights, so it is derived from R7; it is a record of its own, not a Zenodo version of
# R7's, and R7 is not superseded), the training scans (8 NLI IIIF manifests, 37 Internet Archive
# items and 1 Wikimedia Commons file) and the transcription source. The 48 Reshumot booklets are
# not linked here: their publisher URLs are opaque API links; each booklet's number, URL and PDF
# sha256 are in r8b_training_run.json.
related:
