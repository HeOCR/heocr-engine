# Zenodo deposit metadata for R6, read by release/zenodo_deposit.py (`--models r6`).
# R6 is a Tesseract model, not a kraken one, so this is NOT HTRMoPo front matter: it is
# not validated against the HTRMoPo v1 schema, has no `software_hints`, and R6 does not go
# to the `ocr_models` community, which `kraken list` and `htrmopo list` read.
# It uses the same keys the script maps for the kraken records (release/README.md, "R6"):
# the title from `summary`, the creators from `authors`, the licence, keywords from `tags`
# and `related` links. The deposit card is this front matter between `---` lines, with
# `id` added, followed by card_body.md. `id` is added at R6 plan step 2: the version DOI
# reserved for this record's draft.
summary: Hebrew printed-text recognition for Tesseract, fine-tuned from tessdata_best heb on real public-domain NLI scans with Project Ben-Yehuda text (HeOCR R6)
# Creators: as the R4d, A1 and R3h records (release/README.md, "Deposits"). Person names
# are "Family, Given"; `type` is the InvenioRDM creator type.
authors:
  - name: Palachy Affek, Shay
    type: personal
    orcid: https://orcid.org/0000-0002-1459-9320
  - name: HeOCR maintainers
    type: organizational
license: Apache-2.0
software_name: tesseract
language:
  - heb
script:
  - Hebr
tags:
  - tesseract
  - traineddata
  - hebrew
  - printed
  - ocr
  - text-recognition
  - real scans
  - HeOCR
model_type:
  - recognition
metrics:  # percent, hocrgen primary.v1, Tesseract 5.5.3 psm 3, E2d4c (see the card body)
  cer_e2d4c_38: 20.9
  wer_e2d4c_38: 40.7
  cer_e2d4c_10: 38.3
# isDerivedFrom links (InvenioRDM related identifiers): the base model, the training scans
# (NLI IIIF manifests) and the transcription source.
related:
  - identifier: https://github.com/tesseract-ocr/tessdata_best/blob/e12c65a915945e4c28e237a9b52bc4a8f39a0cec/heb.traineddata
    resource_type: software
  - identifier: https://iiif.nli.org.il/IIIFv21/990020308000205171/manifest
    resource_type: image
  - identifier: https://iiif.nli.org.il/IIIFv21/990020495520205171/manifest
    resource_type: image
  - identifier: https://iiif.nli.org.il/IIIFv21/990020522850205171/manifest
    resource_type: image
  - identifier: https://iiif.nli.org.il/IIIFv21/990019385920205171/manifest
    resource_type: image
  - identifier: https://iiif.nli.org.il/IIIFv21/990013538860205171/manifest
    resource_type: image
  - identifier: https://github.com/projectbenyehuda/public_domain_dump
    resource_type: dataset
# Zenodo communities, read by the deposit script. heocr only: not ocr_models (kraken/HTRMoPo).
communities:
  - heocr
